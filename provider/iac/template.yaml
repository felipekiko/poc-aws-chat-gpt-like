AWSTemplateFormatVersion: '2010-09-09'
Description: Backend Provider infrastructure

Resources:
  ApwProviderWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: apw-provider
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  ProviderStreamQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: sqs-provider
      VisibilityTimeout: 900

  ProviderDispatcherLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProviderDispatcherPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt ProviderStreamQueue.Arn

  ProviderDispatcherLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lambda-provider-dispatcher
      Handler: index.lambda_handler
      Role: !GetAtt ProviderDispatcherLambdaRole.Arn
      Runtime: python3.11
      Timeout: 30
      Environment:
        Variables:
          STREAM_QUEUE_URL: !Ref ProviderStreamQueue
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              pass

  ProviderDispatcherLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProviderDispatcherLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApwProviderWebSocketApi}/*/*

  ProviderWorkerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProviderWorkerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ProviderStreamQueue.Arn
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApwProviderWebSocketApi}/*/POST/@connections/*

  ProviderWorkerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lambda-provider-worker
      Handler: index.lambda_handler
      Role: !GetAtt ProviderWorkerLambdaRole.Arn
      Runtime: python3.11
      Timeout: 900
      Environment:
        Variables:
          STREAM_QUEUE_URL: !Ref ProviderStreamQueue
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              pass

  ProviderWorkerLambdaSQSTrigger:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      EventSourceArn: !GetAtt ProviderStreamQueue.Arn
      FunctionName: !GetAtt ProviderWorkerLambda.Arn
      Enabled: true

  ApwProviderWebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApwProviderWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProviderDispatcherLambda.Arn}/invocations

  ApwProviderWebSocketRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApwProviderWebSocketApi
      RouteKey: sendPrompt
      Target: !Sub integrations/${ApwProviderWebSocketIntegration}

  ApwProviderWebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ApwProviderWebSocketApi
      StageName: prod
      AutoDeploy: true

Outputs:
  ProviderWebSocketApiEndpoint:
    Description: WebSocket API endpoint
    Value: !Sub wss://${ApwProviderWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod/
